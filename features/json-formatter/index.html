<div class="card tool">
    <div class="field">
        <div class="field-head">
            <label for="json-input">JSON</label>
            <span class="field-meta" data-count="input"></span>
        </div>
        <textarea id="json-input" data-role="input" rows="10" spellcheck="false" placeholder='{"ten": "Nguyễn Văn A", "tuoi": 30}'></textarea>
    </div>

    <div class="tool-actions">
        <button type="button" class="btn" data-action="format">Định dạng đẹp</button>
        <button type="button" class="btn btn-outline" data-action="minify">Nén (Minify)</button>
        <button type="button" class="btn btn-outline" data-action="validate">Kiểm tra hợp lệ</button>
        <button type="button" class="btn btn-outline" data-action="escape">Escape</button>
        <button type="button" class="btn btn-outline" data-action="unescape">Unescape</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-action="example">Thử ví dụ</button>
        <button type="button" class="btn btn-ghost" data-action="clear">Xóa</button>
    </div>

    <p class="tool-error" data-role="error" role="alert" hidden></p>

    <div class="field">
        <div class="field-head">
            <label for="json-output">Kết quả</label>
            <span class="field-meta" data-count="output"></span>
            <button type="button" class="btn btn-sm btn-outline" data-action="copy">📋 Sao chép</button>
        </div>
        <textarea id="json-output" data-role="output" rows="10" readonly spellcheck="false"></textarea>
    </div>

    <p class="tool-hint">Mẹo: nhấn <kbd>Ctrl</kbd> + <kbd>Enter</kbd> để định dạng nhanh.</p>
</div>
