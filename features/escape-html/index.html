<div class="card">
    <div class="form-group">
        <label>Input</label>
        <textarea id="html-input" rows="8" placeholder="Nhập HTML cần escape/unescape..."></textarea>
    </div>
    <div class="btn-group">
        <button id="html-escape" class="btn">Escape</button>
        <button id="html-unescape" class="btn btn-secondary">Unescape</button>
        <button id="html-clear" class="btn btn-secondary">Clear</button>
    </div>
    <div class="form-group">
        <label>Output</label>
        <textarea id="html-output" rows="8" readonly></textarea>
    </div>
</div>
