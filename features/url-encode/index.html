<div class="card">
    <h3>🔗 URL Encode - Mã Hóa URL</h3>
    
    <div class="form-group">
        <label for="url-encode-input">Nhập text/URL cần encode:</label>
        <textarea id="url-encode-input" rows="10" placeholder="Nhập text hoặc URL..."></textarea>
    </div>
    
    <button class="btn" onclick="encodeURL()">🔗 Encode URL</button>
    
    <div class="form-group">
        <label for="url-encode-output">Kết quả URL encoded:</label>
        <textarea id="url-encode-output" rows="10" readonly></textarea>
    </div>
    
    <div class="btn-group">
        <button class="btn btn-success" onclick="copyURLEncodeResult()">📋 Copy</button>
        <button class="btn btn-secondary" onclick="clearURLEncode()">🗑️ Clear</button>
    </div>
</div>
