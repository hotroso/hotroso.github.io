<div class="card">
    <h3>✨ JS Beautify - Định Dạng JavaScript</h3>
    
    <div class="form-group">
        <label for="js-beautify-input">Nhập JavaScript code:</label>
        <textarea id="js-beautify-input" rows="12" placeholder="function hello(){console.log('Hello');}"></textarea>
    </div>
    
    <button class="btn" onclick="beautifyJS()">✨ Beautify JavaScript</button>
    
    <div class="form-group">
        <label for="js-beautify-output">Kết quả beautified:</label>
        <textarea id="js-beautify-output" rows="12" readonly></textarea>
    </div>
    
    <div class="btn-group">
        <button class="btn btn-success" onclick="copyJSBeautifyResult()">📋 Copy</button>
        <button class="btn btn-secondary" onclick="clearJSBeautify()">🗑️ Clear</button>
    </div>
</div>
