<div class="card tool">
    <div class="field">
        <div class="field-head">
            <label for="js-beautify-input">JavaScript</label>
            <span class="field-meta" data-count="input"></span>
        </div>
        <textarea id="js-beautify-input" data-role="input" rows="12" spellcheck="false" placeholder="function hello(name){console.log('Hello '+name)}"></textarea>
    </div>

    <div class="tool-actions">
        <button type="button" class="btn" data-action="beautify">Beautify JavaScript</button>
        <label class="inline-field">
            Indent
            <select data-option="indent">
                <option value="2">2 spaces</option>
                <option value="4">4 spaces</option>
                <option value="tab">Tab</option>
            </select>
        </label>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-action="example">Try example</button>
        <button type="button" class="btn btn-ghost" data-action="clear">Clear</button>
    </div>

    <p class="tool-error" data-role="error" role="alert" hidden></p>

    <div class="field">
        <div class="field-head">
            <label for="js-beautify-output">Result</label>
            <span class="field-meta" data-count="output"></span>
            <button type="button" class="btn btn-sm btn-outline" data-action="copy">📋 Copy</button>
        </div>
        <textarea id="js-beautify-output" data-role="output" rows="12" readonly spellcheck="false"></textarea>
    </div>

    <p class="tool-hint">Tip: press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to beautify quickly.</p>
</div>
