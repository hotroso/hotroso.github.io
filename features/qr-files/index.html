<div class="card tool qr-files-container">
    <div class="tool-actions qr-files-header">
        <button type="button" id="qr-files-switch" class="btn btn-outline">🔄 Switch camera</button>
        <a id="qr-files-download" class="btn hidden" download="received_file.bin">📥 Download file</a>
    </div>

    <div class="qr-scanner-container">
        <div id="qr-files-reader"></div>
    </div>

    <div id="qr-files-status" role="status" aria-live="polite">⏳ Starting camera…</div>

    <div class="qr-stats">
        <div class="qr-stat-item">
            <div class="qr-stat-value" id="qr-files-received">0</div>
            <div class="qr-stat-label">Received</div>
        </div>
        <div class="qr-stat-item">
            <div class="qr-stat-value" id="qr-files-total">?</div>
            <div class="qr-stat-label">Total</div>
        </div>
        <div class="qr-stat-item">
            <div class="qr-stat-value" id="qr-files-progress">0%</div>
            <div class="qr-stat-label">Progress</div>
        </div>
    </div>

    <div class="qr-progress-bar" role="progressbar" aria-label="File receive progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="qr-progress-fill" id="qr-files-fill"></div>
    </div>

    <div id="qr-files-missing" class="hidden">
        <div class="qr-missing-title">📋 Missing blocks:</div>
        <div id="qr-files-missing-list"></div>
    </div>

    <div id="qr-files-log" aria-label="Scan log"></div>
</div>

<div id="qr-files-list" class="card" hidden>
    <h3 class="card-title">📂 Received files</h3>
    <div id="qr-files-list-wrap"></div>
    <div id="qr-files-list-pg" class="pagination"></div>
</div>
