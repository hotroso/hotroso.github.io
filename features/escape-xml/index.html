<div class="card">
    <div class="form-group">
        <label>Input</label>
        <textarea id="xml-input" rows="8" placeholder="Nhập XML cần escape/unescape..."></textarea>
    </div>
    <div class="btn-group">
        <button id="xml-escape" class="btn">Escape</button>
        <button id="xml-unescape" class="btn btn-secondary">Unescape</button>
        <button id="xml-clear" class="btn btn-secondary">Clear</button>
    </div>
    <div class="form-group">
        <label>Output</label>
        <textarea id="xml-output" rows="8" readonly></textarea>
    </div>
</div>
