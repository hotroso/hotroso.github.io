<div class="card">
    <div class="form-group">
        <label>Input</label>
        <textarea id="sql-input" rows="8" placeholder="Nhập SQL string cần escape..."></textarea>
    </div>
    <div class="btn-group">
        <button id="sql-escape" class="btn">Escape</button>
        <button id="sql-clear" class="btn btn-secondary">Clear</button>
    </div>
    <div class="form-group">
        <label>Output</label>
        <textarea id="sql-output" rows="8" readonly></textarea>
    </div>
</div>
