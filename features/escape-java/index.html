<div class="card">
    <div class="form-group">
        <label>Input</label>
        <textarea id="java-input" rows="8" placeholder="Nhập text cần escape/unescape..."></textarea>
    </div>
    <div class="btn-group">
        <button id="java-escape" class="btn">Escape</button>
        <button id="java-unescape" class="btn btn-secondary">Unescape</button>
        <button id="java-clear" class="btn btn-secondary">Clear</button>
    </div>
    <div class="form-group">
        <label>Output</label>
        <textarea id="java-output" rows="8" readonly></textarea>
    </div>
</div>
