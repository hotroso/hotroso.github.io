<div class="card tool">
    <div class="field">
        <div class="field-head">
            <label for="url-input">Input</label>
            <span class="field-meta" data-count="input"></span>
        </div>
        <textarea id="url-input" data-role="input" rows="8" spellcheck="false" placeholder="Enter text or parameters to encode, or a percent-encoded string (%20…) to decode…"></textarea>
    </div>

    <div class="tool-actions">
        <button type="button" class="btn" data-action="encode">Encode</button>
        <button type="button" class="btn btn-outline" data-action="decode">Decode</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-action="example">Try example</button>
        <button type="button" class="btn btn-ghost" data-action="clear">Clear</button>
    </div>

    <p class="tool-error" data-role="error" role="alert" hidden></p>

    <div class="field">
        <div class="field-head">
            <label for="url-output">Result</label>
            <span class="field-meta" data-count="output"></span>
            <button type="button" class="btn btn-sm btn-outline" data-action="copy">📋 Copy</button>
        </div>
        <textarea id="url-output" data-role="output" rows="8" readonly spellcheck="false"></textarea>
    </div>

    <p class="tool-hint">Tip: press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to encode quickly. Encoding uses <code>encodeURIComponent</code>, suitable for query parameter values.</p>
</div>
