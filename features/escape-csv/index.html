<div class="card">
    <div class="form-group">
        <label>Input</label>
        <textarea id="csv-input" rows="8" placeholder="Nhập CSV text cần escape/unescape..."></textarea>
    </div>
    <div class="btn-group">
        <button id="csv-escape" class="btn">Escape</button>
        <button id="csv-unescape" class="btn btn-secondary">Unescape</button>
        <button id="csv-clear" class="btn btn-secondary">Clear</button>
    </div>
    <div class="form-group">
        <label>Output</label>
        <textarea id="csv-output" rows="8" readonly></textarea>
    </div>
</div>
