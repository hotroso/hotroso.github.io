<div class="card">
    <form id="qr-generation-form">
        <div class="form-group">
            <label for="qr-content">Nhập nội dung QR Code</label>
            <textarea id="qr-content" rows="6" placeholder="Nhập văn bản, URL hoặc dữ liệu bạn muốn chuyển thành QR code..." autocomplete="off"></textarea>
            <div class="char-count">Tổng số ký tự: <span id="countchars">0</span></div>
        </div>
        <button type="submit" class="btn">Tạo QR Code</button>
    </form>
    <div id="qr-code"></div>
</div>
