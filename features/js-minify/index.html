<div class="card tool">
    <div class="field">
        <div class="field-head">
            <label for="js-minify-input">Mã JavaScript</label>
            <span class="field-meta" data-count="input"></span>
        </div>
        <textarea id="js-minify-input" data-role="input" rows="12" spellcheck="false" placeholder="function xinChao(ten) { console.log('Xin chào ' + ten); }"></textarea>
    </div>

    <div class="tool-actions">
        <button type="button" class="btn" data-action="minify">Nén JavaScript</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-action="example">Thử ví dụ</button>
        <button type="button" class="btn btn-ghost" data-action="clear">Xóa</button>
    </div>

    <p class="tool-error" data-role="error" role="alert" hidden></p>

    <div class="field">
        <div class="field-head">
            <label for="js-minify-output">Kết quả</label>
            <span class="field-meta" data-count="output"></span>
            <button type="button" class="btn btn-sm btn-outline" data-action="copy">📋 Sao chép</button>
        </div>
        <textarea id="js-minify-output" data-role="output" rows="12" readonly spellcheck="false"></textarea>
    </div>

    <p class="tool-hint">Mẹo: nhấn <kbd>Ctrl</kbd> + <kbd>Enter</kbd> để nén nhanh.</p>
</div>
